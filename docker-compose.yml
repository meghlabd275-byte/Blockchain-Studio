version: '3.8'

services:
  tigerscan-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: tigerscan-api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://tigerscan:tigerpass@postgres:5432/tigerscan
      - REDIS_URL=redis://redis:6379
      - RPC_URL=${RPC_URL:-https://eth-mainnet.alchemyapi.io}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres
      - redis
    networks:
      - tigerscan-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: tigerscan-postgres
    environment:
      - POSTGRES_USER=tigerscan
      - POSTGRES_PASSWORD=tigerpass
      - POSTGRES_DB=tigerscan
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - tigerscan-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tigerscan-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - tigerscan-network
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: tigerscan-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - tigerscan-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  elasticsearch-data:

networks:
  tigerscan-network:
    driver: bridge